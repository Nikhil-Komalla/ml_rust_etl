[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "inline-more", "raw-entry", "allocator-api2"] }
memchr = "2.7"
mimalloc = { version = "0.1", default-features = false }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
parquet = { version = "54", default-features = false, features = ["snap"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
